<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Notes.png" type="image/x-icon">
    <title>Notes Home</title>

    <style>
        /* Custom properties for easy theme management and consistency */
        :root {
            --primary-color: #4f46e5;
            /* Modern Indigo */
            --primary-hover: #4338ca;
            --text-main: #1f2937;
            /* Deep charcoal, better than pure black */
            --text-muted: #4b5563;
            /* Medium gray for secondary text */
            --bg-gradient: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            --card-bg: #ffffff;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --transition: all 0.25s ease-in-out;
        }

        /* Resetting default body styles for a centered showcase layout */
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Main Container (The Home Card) */
        #Home {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 480px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Typography & Headers */
        #Home h1 {
            color: var(--text-main);
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        #Home p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        /* Features List */
        #Home ul {
            list-style: none;
            /* Remove default ugly dots */
            padding: 0;
            margin: 0 0 2rem 0;
        }

        #Home li {
            color: var(--text-main);
            font-size: 0.95rem;
            position: relative;
            padding-left: 1.75rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
        }

        /* Professional checkmark bullet replacement using CSS */
        #Home li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--primary-color);
            font-weight: bold;
            background-color: #eef2ff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        /* Call to Action Section */
        #Start {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            border-top: 1px solid #f3f4f6;
            padding-top: 1.5rem;
        }

        #Start span {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* The Call to Action Link styled as a Button */
        #Start .cta-btn {
            display: inline-block;
            text-align: center;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        #Start .cta-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        #Start .cta-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>

<body>
    <div id="Home">
        <h1>Welcome to Notes App</h1>
        <p>This app allows you to seamlessly manage your tasks. You can perform the following actions:</p>

        <ul>
            <li>Registration Process</li>
            <li>Login Process</li>
            <li>Change / Update password</li>
            <li>Logout</li>
        </ul>

        <div id="Start">
            <span>Click below to start!</span>
           <a href="https://registration-backend-production-bf27.up.railway.app/register" class="cta-btn">Start</a>
        </div>
    </div>
</body>

</html>
